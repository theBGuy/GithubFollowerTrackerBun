services:
  postgres:
    image: postgres:16-alpine
    container_name: github-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: github_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: github-tracker-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/github_tracker
      
      # GitHub
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_USERNAME: ${GITHUB_USERNAME}
      GITHUB_IS_ORG: ${GITHUB_IS_ORG:-false}
      
      # Notifications
      ENABLE_EMAIL: ${ENABLE_EMAIL:-false}
      ENABLE_SLACK: ${ENABLE_SLACK:-false}
      ENABLE_DISCORD: ${ENABLE_DISCORD:-false}
      
      # Email
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_SECURE: ${EMAIL_SECURE:-false}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_TO: ${EMAIL_TO}
      
      # Slack
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
      
      # Discord
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
      
      # Scheduling
      CHECK_INTERVAL: ${CHECK_INTERVAL:-0 * * * *}
    env_file:
      - .env

volumes:
  postgres_data:
